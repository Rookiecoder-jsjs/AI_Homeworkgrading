services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-homework-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
      - ./backend/fonts:/app/fonts
    restart: unless-stopped
